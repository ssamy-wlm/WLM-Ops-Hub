<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Realtime Task Board (Supabase) — WLM Ops Hub</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; background: #f5f6f8; }
  h1 { font-size: 18px; }
  #taskBoardRoot { display: flex; gap: 16px; margin-top: 16px; }
  .task-column { flex: 1; background: #fff; border-radius: 10px; padding: 12px; min-height: 200px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .task-column h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; color: #666; }
  .task-card { background: #f0f2f5; border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 13px; }
  .task-client, .task-assignee { color: #777; font-size: 11px; margin-top: 2px; }
</style>
</head>
<body>
  <h1>Realtime Task Board (Supabase)</h1>
  <p>Standalone test page — not yet wired into client.html. Requires NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY set in Vercel env vars and the migration in supabase/migrations/ applied to your Supabase project.</p>
  <div id="taskBoardRoot">Loading…</div>

  <script type="module">
    import { mountTaskBoard } from './lib/taskBoard.js';
    mountTaskBoard(document.getElementById('taskBoardRoot'));
  </script>
</body>
</html>
