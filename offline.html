<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>You're offline – WebLight Media Operations Hub</title>
<link rel="icon" href="/assets/icon-192.png">
<style>
  :root{ --bg:#F7F7F5; --bg2:#E8F1FC; --text-dark:#1A3A6E; --text-mid:#5B84C4; --gold:#F5B000; --card:#FFFFFF; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);
    color:var(--text-dark);
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  .card{
    background:var(--card); border-radius:16px; padding:40px 32px; max-width:380px; width:100%;
    text-align:center; box-shadow:0 4px 24px rgba(26,58,110,.13);
  }
  img{width:72px;height:72px;margin-bottom:16px;}
  h1{font-size:19px;margin:0 0 10px;color:var(--text-dark);}
  p{font-size:14px;color:var(--text-mid);line-height:1.5;margin:0 0 20px;}
  button{
    background:var(--gold); color:#1A3A6E; border:none; border-radius:10px; padding:12px 22px;
    font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  button:hover{opacity:.9;}
</style>
</head>
<body>
  <div class="card">
    <img src="/assets/icon-192.png" alt="WebLight Media">
    <h1>You're offline</h1>
    <p>Reconnect to use the Operations Hub.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
